<div class="backlogs-page" style="display:grid; grid-template-columns: 260px 1fr; gap:1rem;">
    <aside class="types-list" style="border-right:1px solid #eef2f7; padding-right:0.75rem;">
        <h3 style="margin-top:0;">Work Item Types</h3>
        <ul style="list-style:none; padding-left:0; margin:0;">
            <li *ngFor="let t of workItemTypes" style="margin:0.25rem 0;">
                <button class="btn type-btn"
                    style="width:100%; text-align:left; background:transparent; border:1px solid transparent; padding:0.5rem; display:flex; gap:0.6rem; align-items:center;"
                    [class.active]="selectedType===t" (click)="selectType(t)">
                    <span class="type-dot" [style.background]="getTypeColor(t.Name)"></span>
                    <span>{{t.Name}}</span>
                </button>
            </li>
        </ul>
    </aside>

    <section class="backlog-list">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <div>
                <h2 style="margin:0;">{{selectedType?.Name || 'Backlog'}}</h2>
                <div class="subtitle" style="color:#6b7280;">Backlog items for {{selectedType?.Name}}</div>
            </div>
            <div>
                <button class="btn btn-primary">New {{selectedType?.Name || 'Item'}}</button>
            </div>
        </div>

                <div class="filters" style="display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.75rem;">
                        <div style="display:flex; gap:0.5rem; align-items:center;">
                            <input class="field-input" placeholder="Search title" [(ngModel)]="filter.q" style="flex:1;" />
                            <input class="field-input" placeholder="SP min" [(ngModel)]="filter.minSP" style="width:80px;" />
                            <input class="field-input" placeholder="SP max" [(ngModel)]="filter.maxSP" style="width:80px;" />
                            <button class="btn" (click)="filter={ q:'', assignee:'', state:'', minSP:null, maxSP:null }">Clear</button>
                        </div>

                        <div style="display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap" (click)="closeDropdowns()">
                            <div style="display:flex; gap:0.4rem; align-items:center; position:relative;">
                                <div style="font-size:0.9rem; color:#374151; margin-right:6px">Assignee:</div>
                                <div class="custom-select" (click)="$event.stopPropagation()">
                                    <button class="select-toggle" (click)="toggleAssignee()">
                                        {{ filter.assignee || 'All assignees' }}
                                        <span class="caret">▾</span>
                                    </button>
                                    <div class="select-panel" *ngIf="assigneeOpen">
                                        <div class="select-option" (click)="selectAssignee('')">All assignees</div>
                                        <div class="select-option" *ngFor="let u of users" (click)="selectAssignee(u.Name)">
                                            <span class="chip-dot" [style.background]="getAssigneeColor(u.Name)"></span>
                                            {{u.Name}}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div style="display:flex; gap:0.4rem; align-items:center; position:relative;">
                                <div style="font-size:0.9rem; color:#374151; margin-right:6px">State:</div>
                                <div class="custom-select" (click)="$event.stopPropagation()">
                                    <button class="select-toggle" (click)="toggleState()">
                                        {{ filter.state || 'All states' }}
                                        <span class="caret">▾</span>
                                    </button>
                                    <div class="select-panel" *ngIf="stateOpen">
                                        <div class="select-option" (click)="selectState('')">All states</div>
                                        <div class="select-option" *ngFor="let s of availableStates" (click)="selectState(s)">
                                            <span class="chip-badge" [style.background]="getStateColor(s)"></span>
                                            {{s}}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                </div>

        <div *ngIf="filteredItems && filteredItems.length; else empty">
            <div
                style="display:grid; grid-template-columns: 1fr 120px 120px 80px; gap:0.5rem; font-weight:700; padding:0.5rem 0; border-bottom:1px solid #eef2f7;">
                <div>Title</div>
                <div>Assignee</div>
                <div>State</div>
                <div>SP</div>
            </div>
            <div *ngFor="let it of filteredItems"
                style="display:grid; grid-template-columns: 1fr 160px 140px 80px; gap:0.5rem; padding:0.6rem 0; border-bottom:1px dashed #f1f5f9; align-items:center;">
                <div>
                    <div style="font-weight:600">{{it.title}}</div>
                </div>
                <div>
                    <div class="assignee-cell">
                        <div class="avatar" [style.background]="getAssigneeColor(it.assignee)">{{
                            getInitials(it.assignee) }}</div>
                        <div class="assignee-name">{{it.assignee}}</div>
                    </div>
                </div>
                <div>
                    <span class="state-badge" [style.background]="getStateColor(it.state)">{{it.state}}</span>
                </div>
                <div>{{it.storyPoint}}</div>
            </div>
        </div>

        <ng-template #empty>
            <div class="panel-empty">No backlog items yet.</div>
        </ng-template>
    </section>
</div>
