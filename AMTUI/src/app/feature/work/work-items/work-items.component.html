<div style="display:grid; grid-template-columns: 260px 1fr; gap:1rem;">
	<aside>
		<h3 style="margin-top:0;">Work Item Types</h3>
		<ul style="list-style:none; padding-left:0; margin:0;">
			<li *ngFor="let t of workItemTypes" style="margin:0.4rem 0;">
				<button class="btn" style="width:100%; text-align:left; background:transparent;" (click)="selectType(t)">{{t.Name}}</button>
			</li>
		</ul>
	</aside>

	<section>
		<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
			<div>
				<h2 style="margin:0">{{selectedType?.Name || 'Work Items'}}</h2>
				<div class="subtitle">List of {{selectedType?.Name || 'items'}}</div>
			</div>
			<div>
				<input class="field-input" placeholder="Search" [(ngModel)]="filterQ" style="margin-right:0.5rem;" />
				<button class="btn btn-primary" (click)="openEditor()">New {{selectedType?.Name || 'Item'}}</button>
			</div>
		</div>

		<div *ngIf="filteredItems && filteredItems.length; else empty">
			<div style="display:grid; grid-template-columns: 1fr 120px 120px 80px; gap:0.5rem; font-weight:700; padding:0.4rem 0; border-bottom:1px solid #eef2f7;">
				<div>Title</div>
				<div>Assignee</div>
				<div>State</div>
				<div></div>
			</div>
			<div *ngFor="let it of filteredItems" style="display:grid; grid-template-columns: 1fr 160px 140px 100px; gap:0.5rem; padding:0.6rem 0; border-bottom:1px dashed #f1f5f9; align-items:center;">
				<div>
					<div style="font-weight:600">{{it.title}}</div>
				</div>
				<div>
					<ng-container *ngIf="editingId!==it.id; else editAssignee">
						<div style="display:flex; align-items:center; gap:0.6rem">
						  <div class="avatar" [style.background]="getAssigneeColor(it.assignedTo)" style="width:32px;height:32px;border-radius:8px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700">{{getInitials(it.assignedTo)}}</div>
						  <div>{{it.assignedTo}}</div>
						</div>
					</ng-container>
					<ng-template #editAssignee>
						<select class="field-input" [(ngModel)]="tempEdit.assignedTo">
							<option value="">Unassigned</option>
							<option *ngFor="let u of users" [value]="u.Name">{{u.Name}}</option>
						</select>
					</ng-template>
				</div>
				<div>
					<ng-container *ngIf="editingId!==it.id; else editState">
						<span class="state-badge" [style.background]="getStateColor(it.state)">{{it.state}}</span>
					</ng-container>
					<ng-template #editState>
						<select class="field-input" [(ngModel)]="tempEdit.state">
							<option *ngFor="let s of stateOptions" [value]="s">{{s}}</option>
						</select>
					</ng-template>
				</div>
				<div style="display:flex; gap:0.4rem; justify-content:flex-end;">
					<ng-container *ngIf="editingId!==it.id">
						<button class="icon-btn" (click)="beginInlineEdit(it)" title="Edit">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M12 20h9"/>
								<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
							</svg>
						</button>
					</ng-container>
					<ng-container *ngIf="editingId===it.id">
						<div class="action-buttons">
							<button class="btn btn-primary" (click)="saveInlineEdit()">Save</button>
							<button class="btn" (click)="cancelInlineEdit()">Cancel</button>
						</div>
					</ng-container>
				</div>
			</div>
		</div>
		<ng-template #empty><div class="panel-empty">No items</div></ng-template>

		<!-- Modal editor -->
		<div *ngIf="showEditor" class="modal-backdrop" (click)="closeEditor()" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(2,6,23,0.45); z-index:80;">
			<div class="modal-card" (click)="$event.stopPropagation()" style="width:880px; max-width:94%; background:#fff; border-radius:10px; padding:1rem; box-shadow:0 18px 48px rgba(2,6,23,0.28);">
				<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
					<h3 style="margin:0">{{ editingItem?.title ? 'Edit Item' : 'Create Item' }}</h3>
					<button class="btn" (click)="closeEditor()" aria-label="Close">✕</button>
				</div>
				<app-work-item-create #editor></app-work-item-create>
				<div style="margin-top:0.75rem; display:flex; gap:0.5rem; justify-content:flex-end;">
					<button class="btn" (click)="closeEditor()">Close</button>
				</div>
			</div>
		</div>
	</section>
</div>
